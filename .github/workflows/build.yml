name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache git libffi-dev libssl-dev python3-dev zip unzip zlib1g-dev autoconf libtool pkg-config

      - name: Install compatible Buildozer & python-for-android
        run: |
          python -m pip install --upgrade "pip<24.1" "setuptools<70.0"
          pip install --upgrade cython
          pip install --upgrade git+https://github.com/kivy/python-for-android.git
          pip install --upgrade git+https://github.com/kivy/buildozer.git

      - name: Build APK with Buildozer
        run: |
          yes | buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PYCKEND-APK
          path: bin/*.apk
